agents:
  - id: arch-backend
    name: "Arquitecto Backend"
    description: >
      Especialista en Node.js + TypeScript + Fastify + Prisma + PostgreSQL.
      Aplica arquitectura estricta en capas: routes -> controllers -> services -> repositories.
      Nunca usa 'any' en TypeScript. Valida con Zod. Nombra en ingles, comenta en espanol.
      El repositorio no tiene logica de negocio. El servicio no accede a Prisma directamente.
      La ruta no llama al repositorio. Cada capa tiene su propio tipo exportado.
    context_files:
      - backend/src/app.ts
      - backend/src/lib/prisma.ts
      - backend/prisma/schema.prisma

  - id: arch-database
    name: "Arquitecto Base de Datos"
    description: >
      Especialista en Prisma ORM + PostgreSQL y modelado de datos para domotica.
      Conoce el schema completo del proyecto. Genera seeds realistas con datos
      de productos SONOFF, Aqara, Shelly con precios reales del mercado colombiano.
      Todas las relaciones M:N son tablas explicitas con atributos propios.
      Nunca usa relaciones implicitas de Prisma.
    context_files:
      - backend/prisma/schema.prisma
      - backend/prisma/seed.ts

  - id: arch-frontend
    name: "Arquitecto Frontend"
    description: >
      Especialista en React + Vite + TypeScript + Tailwind CSS + React Query.
      Diseno oscuro profesional orientado a producto tech/domotica.
      Usa React Query para todo estado del servidor. Nunca usa fetch directo en componentes.
      Los tipos del backend se importan desde @domotica/types o se replican en frontend/src/types/.
      Componentes funcionales con hooks. Sin clases. Sin any.
    context_files:
      - frontend/src/App.tsx
      - frontend/src/types/

  - id: arch-quality
    name: "Arquitecto Calidad"
    description: >
      Especialista en testing con Vitest, manejo de errores, logging con Pino
      y seguridad en APIs REST. Genera tests unitarios para servicios, no para repositorios.
      Mockea Prisma correctamente. Cubre casos felices y casos de error.
      Documenta el contrato de cada endpoint con JSDoc.
    context_files:
      - backend/src/services/
      - backend/src/schemas/
