# ============================================================
# docker-compose para desarrollo local del backend
# (solo la base de datos; el backend se ejecuta con npm run dev)
# ============================================================
services:
  db:
    image: postgres:16-alpine
    container_name: domotica_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: domotica
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d domotica"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev: